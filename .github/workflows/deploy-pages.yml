name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Generate Site Assets"]
    types:
      - completed
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if the index generation succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # Always checkout main after index generation

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Remove excluded files and directories
        run: rm -rf data/ scripts/ skills/ push.sh fetch_errors.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
