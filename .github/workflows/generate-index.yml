name: Generate Indexes on Change

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed directories
        id: changes
        run: |
          # Find changed files
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)

          if [ -z "$CHANGED" ]; then
            echo "No changed files."
            echo "dirs=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Convert to directories, dedupe, remove '.' and empty
          DIRS=$(echo "$CHANGED" | xargs -I {} dirname {} | sort -u | grep -vE '^\.?$' || true)

          echo "Detected changed dirs:"
          echo "$DIRS"

          # Output for next step
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT

      - name: Generate indexes only where needed
        if: ${{ steps.changes.outputs.dirs != '' }}
        run: |
          echo "Regenerating index.html for:"
          echo "${{ steps.changes.outputs.dirs }}"
          ./.github/scripts/generate-index.sh ${{ steps.changes.outputs.dirs }}

      - name: Commit & push index updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff-index --quiet HEAD; then
            echo "No index changes — nothing to commit."
          else
            git commit -m "Auto-generate directory indexes"
            git push
          fi
