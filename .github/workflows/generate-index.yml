name: Generate Indexes on Change

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate indexes
        run: |
          ./.github/scripts/generate-index.sh techradar

      - name: Commit & push index updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff-index --quiet HEAD; then
            echo "No index changes — nothing to commit."
          else
            git commit -m "Auto-generate directory indexes"
            git push
          fi
