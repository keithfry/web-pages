<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive image cloud gallery with smooth zoom animations">
    <title>Certifications Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="imageCloud" class="image-cloud" role="main" aria-label="Image gallery"
             data-image-cloud
             data-config='{
               "loader": {
                 "type": "googleDrive",
                 "googleDrive": {
                   "apiKey": "AIzaSyBKTCzznRaJt_Nyd9_9agTHDhFieMMe0u8",
                   "sources": [{
                     "type": "folder",
                     "folders": ["https://drive.google.com/drive/folders/19JY4GPJkTIVa5DwrqNftYOuJfGUWRU5t?usp=sharing"]
                   }]
                 }
               }, 
               "layout": {
                "algorithm":"radial"
               },
                "image": {
                    "sizing": {
                      "mode": "adaptive"
                    },
                    "rotation": {
                        "mode": "random",
                        "range": {
                            "min": -10,
                            "max": 10
                        }
                    }
                },
                "styling": {
                    "default": {
                        "border": {
                            "width": 2,
                            "color": "#737373"
                        }
                    }
                }
             }'>
        </div>

        <a href="https://github.com/frybynite/image-cloud" target="_blank" class="github-overlay">
            @frybynite/image-cloud
        </a>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/@frybynite/image-cloud@latest/dist/image-cloud-auto-init.js"></script>
</body>
</html>
