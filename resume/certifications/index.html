<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive image cloud gallery with smooth zoom animations">
    <title>Interactive Image Cloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="imageCloud" class="image-cloud" role="main" aria-label="Image gallery">
            <!-- Images will be dynamically inserted here -->
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading images...</p>
        </div>

        <div id="error" class="error hidden"></div>
    </div>

    <!-- Load modules in order -->
    <script src="js/config.js"></script>
    <script src="js/AnimationEngine.js"></script>
    <script src="js/RandomPlacementGenerator.js"></script>
    <script src="js/RadialPlacementGenerator.js"></script>
    <script src="js/LayoutEngine.js"></script>
    <script src="js/ZoomEngine.js"></script>
    <script src="js/GoogleDriveLoader.js?v=8"></script>
    <script src="js/main.js?v=8"></script>
</body>
</html>
