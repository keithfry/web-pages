<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive image cloud gallery with smooth zoom animations">
    <title>Certifications Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="imageCloud" class="image-cloud" role="main" aria-label="Image gallery"
             data-image-cloud
             data-config='{
               "loaders": [{
                 "static": {
                   "sources": [{
                     "json": "images/images.json"
                   }]
                 }
               }],
               "layout": {
                "algorithm":"radial"
               },
                "image": {
                    "sizing": {
                      "mode": "adaptive"
                    },
                    "rotation": {
                        "mode": "random",
                        "range": {
                            "min": -20,
                            "max": 20
                        }
                    }
                },
                "rendering": {
                    "ui": {
                        "showImageCounter": true
                    }
                },
                "styling": {
                    "default": {
                        "border": {
                            "width": 2,
                            "color": "#737373"
                        }
                    }
                }
             }'>
        </div>

        <a href="https://www.npmjs.com/package/@frybynite/image-cloud" target="_blank" class="ref-overlay">
            @frybynite/image-cloud
        </a>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/@frybynite/image-cloud@0.3.6/dist/image-cloud-auto-init.js"></script>
</body>
</html>
