[project]
name = "ai-techradar-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "feedparser",
    "ollama",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "python-dotenv",
    "beautifulsoup4",
    "matplotlib>=3.10.8",
    "kokoro>=0.9.4",
    "mutagen>=1.47",
    "soundfile>=0.12",
]

[project.scripts]
ai-techradar-agent = "main:main"
